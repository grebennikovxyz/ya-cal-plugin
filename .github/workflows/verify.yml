name: Verify Ya-Ca
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest
      - if: runner.os == 'Windows'
        run: python -m pytest -q
        env:
          YA_CA_UI_TEST: required
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
        env:
          YA_CA_UI_TEST: required
      - if: runner.os == 'Windows'
        name: Build and verify installable archives
        shell: pwsh
        run: |
          python -m pip install uv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv python install cpython-3.13-windows-x86_64-none --install-dir .cache/runtime --no-bin --no-registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = (Get-ChildItem .cache/runtime -Directory -Filter 'cpython-3.13.*-windows-x86_64-none').FullName
          python scripts/package.py --windows-runtime $runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_package.py
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ya-ca-packages
          path: dist/
