[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grebennikov-ya-ca"
version = "0.1.1"
description = "Яндекс Календарь и приглашения Ya-Mail для локальных MCP-клиентов"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "caldav>=1.6,<2",
    "icalendar>=6.3,<7",
    "recurring-ical-events>=3.4,<4",
    "tzdata",
    "mcp>=1.30,<2",
    "pydantic>=2.11,<3",
    "platformdirs>=4,<5",
    "grebennikov-ya-mail @ https://github.com/grebennikovxyz/ya-mail-plugin/releases/download/v0.1.1/grebennikov_ya_mail-0.1.1-py3-none-any.whl#sha256=2f61e0e153e801ff4fc0228ddd5e4068278dde885018cdcd68008d8aa2cdad28",
]

[project.scripts]
ya-ca = "ya_cal.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ya_cal"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/ya-ca/assets/ya-ca.png" = "ya_cal/assets/ya-ca.png"
